# Proxy compartilhado (Caddy): HTTPS automático para todos os subdomínios.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
