# Stack de UM cliente. Uso (feito pelo novo-cliente.sh): docker compose -p <cliente> up -d
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcp
      POSTGRES_PASSWORD: ${DB_SENHA}
      POSTGRES_DB: pcp
      TZ: America/Sao_Paulo
    volumes:
      - dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcp"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m

  app:
    image: pcp-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://pcp:${DB_SENHA}@db:5432/pcp
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # só no loopback da VPS (acesso por túnel SSH); o público passa pelo Caddy
    ports:
      - "127.0.0.1:${PORTA_LOCAL:-3000}:3000"
    networks:
      default: {}
      web:
        aliases:
          - ${CLIENTE}-app
    deploy:
      resources:
        limits:
          memory: 1g

  # agendador: Omie a cada 5 min e programação a cada 30 min
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while true; do
          curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/omie > /dev/null
          if [ $$((i % 6)) -eq 0 ]; then curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/programacao > /dev/null; fi
          i=$$((i + 1)); sleep 300
        done

networks:
  web:
    external: true

volumes:
  dados:
